- name: install frontends
  hosts: frontends
  remote_user: root

  handlers:
    - name: Restart systemd-resolved
      ansible.builtin.service:
        name: systemd-resolved
        state: restarted

  tasks:
    # Free up port 53
    - name: Ensure systemd-resolved drop-in directory exists
      ansible.builtin.file:
        path: /etc/systemd/resolved.conf.d
        state: directory
        mode: "0755"

    - name: Disable DNS stub listener
      ansible.builtin.copy:
        dest: /etc/systemd/resolved.conf.d/no-stub.conf
        mode: "0644"
        content: |
          [Resolve]
          DNSStubListener=no
      notify: Restart systemd-resolved

    - name: Ensure resolv.conf points to systemd-resolved upstream file
      ansible.builtin.file:
        src: /run/systemd/resolve/resolv.conf
        dest: /etc/resolv.conf
        state: link
        force: true

    - name: Upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
        autoremove: yes
    - name: Check if a reboot is needed
      register: reboot_required_file
      stat: path=/var/run/reboot-required get_checksum=no
    - name: Reboot if necessary
      reboot:
        msg: "Reboot initiated by Ansible due to kernel updates"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime
      when: reboot_required_file.stat.exists

    - name: remove root password
      user:
        name: root
        password_lock: yes

    - name: Install desec dependencies
      apt:
        pkg:
        - curl
        - git
        - httpie
        - jq
        - libmysqlclient-dev
        - python3-dev
        - python3-venv
        - python3-docker
        - python3-compose
        - docker.io
        - docker-compose
        - certbot
        - acpid

    - name: Install docker-compose from official github repo
      get_url:
        url : https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64  # same as lib below
        dest: /usr/local/bin/docker-compose
        mode: 'u+x,g+x'

    - name: enable docker daemon (for reboots)
      systemd:
        name: docker
        enabled: yes

    - name: configure docker daemon
      copy:
        content: '{"userland-proxy": false}'
        dest: /etc/docker/daemon.json

    - name: restart docker daemon
      service:
        name: docker
        state: restarted

    - name: download frontend software
      git:
        repo: 'https://github.com/desec-io/desec-ns.git'
        dest: desec-ns
        version: main

    - name: Create .env
      template:
        src: dotenv.j2
        dest: desec-ns/.env
        mode: '0600'

    - name: Pull docker images for frontend
      command:
        cmd: 'docker-compose pull'
        chdir: desec-ns

    - name: Upload lmdb backup
      when: DESEC_NS_LMDB_BACKUP is defined
      copy:
        src: '{{ DESEC_NS_LMDB_BACKUP }}'
        dest: desec-ns/lmdb-backup/backup

    - name: Find lmdb backup
      when: DESEC_NS_LMDB_BACKUP is defined
      find:
        path: desec-ns/lmdb-backup/backup/
      register: files

    - name: Restore lmdb backup
      when: DESEC_NS_LMDB_BACKUP is defined
      command:
        cmd: './load.sh {{ (files.files | sort(attribute="ctime"))[-1].path | basename }}'
        chdir: desec-ns
